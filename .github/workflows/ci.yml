name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.5+ is required for node:sqlite; the lockfile targets 24.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build the shared contract
        run: npm run build --workspace @tracker/shared

      - name: Typecheck the server
        run: npm run typecheck --workspace @tracker/server

      - name: Typecheck the web client
        run: npm run typecheck --workspace @tracker/web

      - name: Run the test suite
        run: npm test
        env:
          NODE_ENV: test
          ENABLE_SCHEDULER: 'false'

      - name: Production build
        run: npm run build

      - name: Verify the database migrates from empty
        run: npm run migrate --workspace @tracker/server
        env:
          DATA_DIR: ${{ runner.temp }}/tracker-ci
          DATABASE_FILE: ${{ runner.temp }}/tracker-ci/ci.db

      - name: Verify the seed script runs
        run: npm run seed --workspace @tracker/server
        env:
          DATA_DIR: ${{ runner.temp }}/tracker-ci
          DATABASE_FILE: ${{ runner.temp }}/tracker-ci/ci.db

      - name: Upload the CI database as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-database
          path: ${{ runner.temp }}/tracker-ci
          retention-days: 3

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # A high-severity advisory fails the build; anything lower is reported.
      - name: Fail on high or critical advisories
        run: |
          if npm audit --audit-level=high; then
            echo "No high or critical advisories."
          else
            echo "::error::High or critical npm advisories found."
            exit 1
          fi
